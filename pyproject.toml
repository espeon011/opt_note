[project]
name = "opt-note"
version = "0.1.0"
description = "Mathematical optimization study note"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "didppy>=0.10.1",
    "hexaly>=15.0.20260731",
    "highspy>=1.15.1",
    "ortools>=9.15.6755",
    "pyscipopt>=6.2.1",
]

[project.optional-dependencies]
patchelf = ["patchelf>=0.17"] # for opt-note-fix-highspy

[project.scripts]
opt-note-fix-highspy = "opt_note.fix_highspy_soname:main"

[dependency-groups]
dev = [
    "marimo[recommended]>=0.24.2",
    "pdoc>=16.0.0",
    "taskipy>=1.14.1",
]

[[tool.uv.index]]
name = "hexaly"
url = "https://pip.hexaly.com"
explicit = true

[tool.uv.sources]
hexaly = { index = "hexaly" }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.marimo.runtime]
pythonpath = ["src"]

[tool.taskipy.tasks]
fix-highspy = "opt-note-fix-highspy"
doc = "rm -rf docs && pdoc opt_note --output-directory docs --math --docformat google"
doc-serve = "pdoc opt_note --math --docformat google --host 0.0.0.0"

[tool.taskipy.settings]
cwd = "."
